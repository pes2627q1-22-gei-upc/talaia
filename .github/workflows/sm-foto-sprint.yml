name: SM · Foto diària del sprint

# Cada nit a les 23:30 (hora d'hivern) desa l'estat del sprint a Taiga (punts, tasques i hores per
# persona) com a artefacte de 90 dies, per als gràfics del report (scripts/sm/README.md).
on:
  schedule:
    - cron: '30 22 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foto:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Configura Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc

      - name: Fa la foto
        id: foto
        run: |
          echo "data=$(TZ=Europe/Madrid date +%F)" >> "$GITHUB_OUTPUT"
          node scripts/sm/foto-sprint.mjs --sortida foto-sprint

      # Fora dels sprints no hi ha foto i no es desa res.
      - name: Desa la foto
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: foto-sprint-${{ steps.foto.outputs.data }}
          path: foto-sprint/
          if-no-files-found: ignore
          retention-days: 90
