name: Deploy check

# Comprova a cada PR que toca el desplegament que les imatges es construeixen i que el compose
# arrenca sencer (amb el certificat autosignat): un deploy trencat no ha d'arribar a `stable`.
on:
  pull_request:
    paths:
      - 'deploy/**'
      - 'services/*/Dockerfile'
      - 'services/worker/**'
      - 'packages/db/**'
      - '.dockerignore'
      - 'package-lock.json'
      - '.github/workflows/deploy*.yml'

permissions:
  contents: read

concurrency:
  group: deploy-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COMPOSE: docker compose -f deploy/compose.yaml --env-file .env.example

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Sintaxi de l'script de deploy
        run: sh -n deploy/scripts/desplega.sh

      - name: Valida el compose
        run: $COMPOSE config -q

      - name: Construeix les imatges
        run: $COMPOSE build

      # El worker necessita DATABASE_URL: aquí n'hi ha una que no respon. L'execució ha de fallar
      # sense aturar el procés (`up --wait` no veu un contenidor que es reinicia).
      - name: Arrenca i comprova /api/v1/health per Nginx
        env:
          DATABASE_URL: postgresql://talaia:talaia@127.0.0.1:1/talaia
        run: |
          $COMPOSE up -d --wait
          curl -fsS -k --resolve talaia.duckdns.org:8080:127.0.0.1 https://talaia.duckdns.org:8080/api/v1/health

      - name: El worker es manté en marxa
        run: |
          sleep 15
          id=$($COMPOSE ps -q worker)
          estat=$(docker inspect -f '{{.State.Status}} {{.RestartCount}}' "$id")
          echo "worker: $estat"
          test "$estat" = "running 0"
          $COMPOSE logs worker | grep -q "en marxa"

      - name: Logs
        if: failure()
        run: $COMPOSE logs
