name: Deploy check

# Comprova a cada PR que toca el desplegament que les imatges es construeixen i que el compose
# arrenca sencer (amb el certificat autosignat): un deploy trencat no ha d'arribar a `stable`.
on:
  pull_request:
    paths:
      - 'deploy/**'
      - 'services/*/Dockerfile'
      - 'services/worker/**'
      - 'apps/admin/**'
      - 'packages/db/**'
      - 'packages/index/**'
      - '.dockerignore'
      - 'package-lock.json'
      - '.github/workflows/deploy*.yml'

permissions:
  contents: read

concurrency:
  group: deploy-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COMPOSE: docker compose -f deploy/compose.yaml --env-file .env.example
      # Obligatòria al compose; a la CI no s'hi valida cap JWT.
      SUPABASE_URL: https://ci.supabase.co
      # Obligatòria per compilar l'admin (TG-176). És la clau pública: aquí, un valor de prova.
      SUPABASE_ANON_KEY: clau-publica-de-prova

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Scripts de deploy (shellcheck)
        run: shellcheck deploy/scripts/*.sh deploy/tests/*.sh

      - name: Valida el compose
        run: $COMPOSE config -q

      - name: Construeix les imatges
        run: $COMPOSE build

      # El worker necessita DATABASE_URL: aquí n'hi ha una que no respon. L'execució ha de fallar
      # sense aturar el procés (`up --wait` no veu un contenidor que es reinicia).
      - name: Arrenca i comprova /api/v1/health per Nginx
        env:
          DATABASE_URL: postgresql://talaia:talaia@127.0.0.1:1/talaia
        run: |
          $COMPOSE up -d --wait
          curl -fsS -k --resolve talaia.duckdns.org:8080:127.0.0.1 https://talaia.duckdns.org:8080/api/v1/health

      # La web d'administració (TG-176): l'index.html, el fallback d'una ruta interna (una
      # recàrrega directa), un recurs que no existeix és un 404 i /admin redirigeix sense el port intern.
      - name: Comprova /admin/ per Nginx
        run: |
          URL=https://talaia.duckdns.org:8080
          CURL="curl -sS -k --resolve talaia.duckdns.org:8080:127.0.0.1"
          $CURL -f "$URL/admin/" | grep -q '<div id="root">'
          $CURL -f "$URL/admin/punts/qualsevol" | grep -q '<div id="root">'
          asset=$($CURL -f "$URL/admin/" | grep -o '/admin/assets/[^"]*\.js' | head -n 1)
          test -n "$asset"
          $CURL -fI "$URL$asset" | grep -qi 'cache-control: public, max-age=31536000, immutable'
          test "$($CURL -o /dev/null -w '%{http_code}' "$URL/admin/assets/no-existeix.js")" = 404
          test "$($CURL -o /dev/null -w '%{redirect_url}' "$URL/admin")" = "$URL/admin/"
          $CURL -fI "$URL/admin/" | grep -qi '^content-security-policy:.*connect-src .self. https://ci.supabase.co'

      - name: El worker es manté en marxa
        run: |
          sleep 15
          id=$($COMPOSE ps -q worker)
          estat=$(docker inspect -f '{{.State.Status}} {{.RestartCount}}' "$id")
          echo "worker: $estat"
          test "$estat" = "running 0"
          $COMPOSE logs worker | grep -q "en marxa"

      - name: Logs
        if: failure()
        run: $COMPOSE logs

  # L'avís de deploy fallat (TG-180, ADR-0035) contra un Mailpit amb STARTTLS i autenticació: un sol
  # correu per fallada, el de recuperació, res sense configurar i cap error si el servidor no respon.
  # També desplega.sh sencer amb el trap (Docker i healthcheck simulats).
  avis:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Prova d'avisa.sh
        run: sh deploy/tests/prova-avis.sh
