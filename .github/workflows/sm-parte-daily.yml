name: SM · Parte de la daily

# Dilluns i dimecres a les 8:00 (hora d'hivern de Catalunya) deixa el parte de la daily a l'issue
# del sprint, esmentant el sprint master, per enganxar-lo al grup (scripts/sm/README.md).
on:
  schedule:
    - cron: '0 7 * * 1,3'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  parte:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Configura Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc

      - name: Publica el parte
        run: node scripts/sm/parte-daily.mjs --issue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
