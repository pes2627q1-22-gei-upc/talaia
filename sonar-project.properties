# Les claus del projecte i de l'organització es passen des de GitHub Actions.
# Activació: docs/ci.md. Abast inicial: app mòbil.
sonar.sourceEncoding=UTF-8
sonar.sources=apps/mobile/src
sonar.tests=apps/mobile/src
sonar.test.inclusions=**/__tests__/**,**/*.test.ts,**/*.test.tsx
sonar.exclusions=**/__tests__/**,**/*.test.ts,**/*.test.tsx,**/*.d.ts

# El workflow adapta les rutes de Jest a l'arrel del repositori.
sonar.javascript.lcov.reportPaths=apps/mobile/coverage/lcov-sonar.info
