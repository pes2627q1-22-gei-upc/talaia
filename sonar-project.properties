# Les claus del projecte i de l'organització es passen des de GitHub Actions.
# Activació i abast: docs/ci.md.
sonar.sourceEncoding=UTF-8
sonar.sources=apps/mobile/src,apps/admin/src,services/api/src,services/worker/src,packages/db/src,packages/index/src
sonar.tests=apps/mobile/src,apps/admin/src,services/api/src,services/worker/src,packages/db/src,packages/index/src
sonar.test.inclusions=**/__tests__/**,**/*.test.ts,**/*.test.tsx
sonar.exclusions=**/__tests__/**,**/*.test.ts,**/*.test.tsx,**/*.d.ts,packages/db/src/schema.ts,services/api/src/testing/**

# schema.ts és generat; testing/ conté helpers exclusius dels tests.
# scripts/ci/prepare-sonar-coverage.mjs adapta les rutes a l'arrel del repositori.
sonar.javascript.lcov.reportPaths=apps/mobile/coverage/lcov-sonar.info,apps/admin/coverage/lcov-sonar.info,services/api/coverage/lcov-sonar.info,services/worker/coverage/lcov-sonar.info,packages/db/coverage/lcov-sonar.info,packages/index/coverage/lcov-sonar.info
